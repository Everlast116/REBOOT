<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="wrapper">
        <header>
            <div class="header-left">
                <a href="index.html">
                    <img src="logo.svg" alt="Friskay logo">
                </a>
                <div class="divider hide-mobile"></div>
                <a class="home hide-mobile" href="#">Home</a>
                
            </div>

            <nav>
                <a href="#" class="menu-open hide-desktop">
                    <img src="menu.svg" alt="Open menu">
                </a>
                <ul class=" open">
                    <li><a href="#" class="menu-close hide-desktop">
                            <img src="close.svg" alt="Close menu">
                        </a>
                    </li>
                    <li><a href="#">Our food</a></li>
                    <li><a href="#">Ingredients</a></li>
                    <li><a href="#">Studies</a></li>
                    <li><a href="#">FAQ</a></li>
                </ul>
            </nav>
        </header>
        <main >

            <h1>Your cat will go <img src="bonkers.svg" alt="Text that says bonkers"></h1>
            <p class="sub-head">..for the world’s best testing cat food,
                sourced with only the finest ingredients.
                Made with love from the heart of Mississippi.
            </p>
            <a href="#" class="primary-cta " >Get Bonkers</a>
            <div class="cat-container">
                <div class="cat">
                    <img src="cat.png" alt="cat image">
                    <div class="inner-circle"></div>
                    <div class="outer-circle"></div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const menu = document.querySelector('nav ul');
        const menuBtn = document.querySelector('.menu-open');
        const closeBtn = document.querySelector('.menu-close');

        menuBtn.addEventListener('click', () => {
            menu.classList.add('open')
        })
        closeBtn.addEventListener('click', () =>  {
            menu.classList.remove('open')
        })
    
 

    </script>
      <!-- //    ',' -->

</body>

</html>
